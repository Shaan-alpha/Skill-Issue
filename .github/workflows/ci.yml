name: CI

# Runs on every PR and every push to main. Catches the v0.8.3-style "ship a
# regression, learn about it from Sentry post-deploy" loop by exercising the
# whole test + lint + build stack before the merge button is reachable.

on:
  pull_request:
  push:
    branches:
      - main

# Node 24: no longer forced. checkout@v7 / setup-node@v6 / setup-uv@v8 target
# Node 24 natively, so the FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 escape hatch that
# used to live here is redundant. It was removed rather than left in place so
# this file stops asserting something untrue about the pins below it.
#
# If a future action pin still targets Node 20, GHA will say so in the run
# annotations (a warning, not a failure) — bump that action rather than
# reinstating the flag, since Node 20 leaves the runner on 2026-09-16.

# v1.0.4 SI-12 — least privilege. CI only reads the repo; no job needs write.
# release.yml keeps its own contents: write for publishing releases.
permissions:
  contents: read

# Avoid running the workflow twice for the same PR (push + pull_request both
# fire). Cancel in-progress runs for the same ref when a new push lands.
#
# ...but NOT on `main`. Every push to main shares one group key
# (`github.ref` is always `refs/heads/main`), so merging several PRs in quick
# succession cancelled each previous merge's run. On 2026-07-31 six PRs merged
# inside ~30s and three merge commits — c08afed, b694214, 5cd73eb — ended up
# on main, and in production, with `cancelled` as their only CI verdict. The
# cumulative state was green afterwards, so nothing shipped broken, but those
# commits are individually unverified: a later bisect or revert would land on
# a commit CI never actually passed.
#
# Superseding is right for a PR (only the tip matters) and wrong for main
# (every merge commit is a deployable artifact), so gate it on the ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Pin Python from .python-version
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pytest (non-DB-fixture)
        # The DB-fixture tests need TEST_DATABASE_URL pointed at a real
        # Postgres branch — out of scope for the cheap pre-merge gate. The
        # 257-test non-DB suite is the right gate for "does the diff break
        # anything we can run for free."
        run: uv run pytest -q --no-header

      - name: Dependency manifests in sync
        # backend/requirements.txt is generated by `uv export`, so editing a
        # pinned line in it by hand bypasses the resolver that makes those pins
        # coherent. Dependabot #45 did exactly that -- it bumped transitive
        # pydantic-core past the version pydantic pins exactly, producing a
        # manifest that could not resolve.
        #
        # Nothing detected that as drift; it surfaced only because pip-audit
        # happened to fail on the result. A drifted manifest that still resolves
        # would pass silently, and in v0.8.5 exactly that went unnoticed for
        # months (requirements.txt was missing 9 of 15 direct dependencies).
        #
        # Regenerating in place rather than diffing a temp file is deliberate:
        # uv's header echoes its own `-o` argument, so a temp path differs on
        # line 2 every time. Same command in, byte-identical file out, and any
        # remaining difference is real drift.
        run: |
          uv lock --check
          uv export --no-hashes --no-dev --format requirements-txt -o requirements.txt
          git diff --exit-code -- requirements.txt

      - name: pip-audit (shipped dependency CVEs)
        # Audits the exported requirements.txt -- the runtime dependency closure,
        # not the dev tooling. Fails the build on any known CVE in it.
        #
        # NOTE: requirements.txt is NOT the install manifest. Vercel resolves the
        # deploy from pyproject.toml + uv.lock (docs/DEPLOY.md). This file exists
        # to feed this audit, which is why the drift guard above matters -- if it
        # drifted, this step would audit something production never installs.
        #
        # v1.0.9: routed through tools/audit_gate.py so an OSV/PyPI outage
        # produces a warning instead of a hard block. Unrecognised failures
        # still fail — see the ERROR verdict in the module docstring.
        run: uv run python tools/audit_gate.py pip --requirements requirements.txt

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (shipped critical advisories)
        # Gate on production-dependency advisories only — dev-tooling advisories
        # (never shipped to the browser) don't block.
        #
        # TEMPORARY (2026-07-24): lowered from `high` to `critical`. A batch of
        # high-severity Next.js advisories was disclosed with NO patched stable
        # release available (npm's only "fix" is a semver-major downgrade to
        # next@9). They block every PR. Exposure assessment for THIS app found no
        # meaningful risk: no Server Actions (`use server`), no middleware, no
        # i18n/locales, no `rewrites`, and Image Optimization is locked to
        # `avatars.githubusercontent.com` (no attacker-controlled images / SVGs).
        # postcss/sharp are build-time / avatar-only. Full write-up in
        # docs/PROGRESS_LOG.md (2026-07-24).
        # RESTORE: change `--threshold critical` to `--threshold high` below once
        # Next.js ships a patched release and `frontend/package.json` is bumped.
        #
        # v1.0.9: routed through the audit gate so an npm registry outage warns
        # instead of hard-blocking every PR (as it did on 2026-07-26).
        run: python3 ../backend/tools/audit_gate.py npm --threshold critical

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test:run

      - name: Next.js build
        # Set throwaway values so any module-level `process.env.X` reads at
        # build time don't crash. Real values come from Vercel at deploy.
        env:
          NEXT_PUBLIC_BACKEND_URL: http://ci-placeholder
        run: npm run build

  config:
    name: Config (vercel.ts typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root devDeps
        run: npm ci

      - name: TypeScript (vercel.ts)
        run: npx tsc --noEmit -p .

  # v1.0.8 SI-37 — PR-time supply-chain gate. Flags newly-introduced vulnerable
  # or malicious dependencies (and license issues) in the PR diff, before merge.
  # Complements pip-audit / npm audit (which scan the whole tree, not the delta).
  # PR-only: the action needs a base..head diff to review.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
