target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[lint.per-file-ignores]
# Narrative prompts are user-facing copy; en dashes (U+2013) are intentional typography.
"app/narrative/prompts.py" = ["RUF001"]
# SQLAlchemy models: datetime import must be runtime (not TYPE_CHECKING) for SQLAlchemy annotation resolution
"app/db/models.py" = ["TC003"]
# Test files use semicolons for compact async test setup (intentional formatting)
"tests/db/test_models.py" = ["E702"]
"tests/persistence/test_analyses.py" = ["E702"]
"tests/routers/test_me.py" = ["E702"]
"tests/routers/test_analyses_share.py" = ["E702"]
# FastAPI routers: SQLAlchemy session types must be runtime imports because FastAPI
# resolves Depends() annotations via get_type_hints() at startup, not statically.
"app/routers/*.py" = ["TC001", "TC002"]
# FastAPI auth dependencies: same reason as routers — User and AsyncSession must be runtime
"app/auth/dependencies.py" = ["TC001", "TC002"]

[lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[format]
quote-style = "double"
