[project]
name = "skill-issue-backend"
version = "1.0.11"
description = "Skill Issue backend — FastAPI service that ingests a GitHub profile and returns a deterministic engineering report."
readme = "README.md"
authors = [
    { name = "Shaan Satsangi", email = "shaansatsangi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "cryptography>=48.0.1",  # GHSA-537c-gmf6-5ccf
    "fastapi>=0.141.1",  # pulls patched starlette (see below)
    "h2>=4.4.1",
    "httpx>=0.28.1",
    "joserfc>=1.6.8",  # CVE-2026-49852 (JWT); security floor, transitive via authlib
    "openai>=2.53.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",  # GHSA-4xgf-cpjx-pc3j
    "sentry-sdk[fastapi]>=2.66.0",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "starlette>=1.4.1",  # directly imported in main.py; PYSEC-2026-248/249, CVE-2026-48817/48818
    "structlog>=24.0",
    "upstash-redis>=1.2",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
