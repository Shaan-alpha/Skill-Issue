[project]
name = "skill-issue-backend"
version = "0.8.1"
description = "Skill Issue backend — FastAPI service that ingests a GitHub profile and returns a deterministic engineering report."
readme = "README.md"
authors = [
    { name = "Shaan Satsangi", email = "shaansatsangi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "h2>=4.3.0",
    "httpx>=0.28.1",
    "openai>=1.50",
    "pydantic>=2",
    "pydantic-settings>=2.14.1",
    "sentry-sdk[fastapi]>=2.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "structlog>=24.0",
    "upstash-redis>=1.2",
    "uvicorn[standard]>=0.47.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
